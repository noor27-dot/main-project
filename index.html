<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Credit Card Fraud Detector</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f1117; color: #e5e5e5; display: flex; justify-content: center; padding: 40px 20px; margin: 0; min-height: 100vh; }
        .container { max-width: 480px; width: 100%; background: #1a1d29; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
        h1 { margin-top: 0; font-size: 24px; }
        .subtitle { color: #9ca3af; margin-bottom: 24px; }
        label { display: block; margin-top: 16px; margin-bottom: 6px; font-size: 14px; color: #cbd5e1; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #0f1117; color: #fff; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { background: #4f46e5; }
        .result { margin-top: 24px; padding: 16px; border-radius: 8px; text-align: center; }
        .result.fraud { background: #3f1d1d; border: 1px solid #ef4444; }
        .result.safe { background: #14301f; border: 1px solid #22c55e; }
        .hidden { display: none; }
        .note { margin-top: 24px; font-size: 12px; color: #6b7280; line-height: 1.5; }
    </style>
</head>
<body>
    <div class="container">
        <h1>💳 Credit Card Fraud Detection</h1>
        <p class="subtitle">Enter transaction details to check fraud risk</p>

        <form id="predictForm">
            <label for="amount">Transaction Amount ($)</label>
            <input type="number" id="amount" step="0.01" value="100.00" required>

            <label for="time">Time (seconds since first transaction)</label>
            <input type="number" id="time" value="50000" required>

            <button type="submit">Check Transaction</button>
        </form>

        <div id="result" class="result hidden">
            <h2 id="resultText"></h2>
            <p id="probText"></p>
        </div>

        <p class="note">
            Note: V1–V28 are anonymized PCA features from the original dataset and are
            simulated here for demo purposes. Only Amount and Time are real user inputs.
        </p>
    </div>

    <script>
        const API_URL = "/api/predict";

        document.getElementById('predictForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const amount = document.getElementById('amount').value;
            const time = document.getElementById('time').value;

            const resultDiv = document.getElementById('result');
            const resultText = document.getElementById('resultText');
            const probText = document.getElementById('probText');

            resultDiv.classList.remove('hidden', 'fraud', 'safe');
            resultText.textContent = "Checking...";
            probText.textContent = "";

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount, time })
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);

                if (data.is_fraud) {
                    resultText.textContent = '⚠️ Fraud Detected';
                    resultDiv.classList.add('fraud');
                } else {
                    resultText.textContent = '✅ Legitimate Transaction';
                    resultDiv.classList.add('safe');
                }
                probText.textContent = `Fraud Probability: ${(data.fraud_probability * 100).toFixed(2)}%`;
            } catch (err) {
                resultText.textContent = "⚠️ Error reaching API";
                probText.textContent = err.message;
                resultDiv.classList.add('fraud');
            }
        });
    </script>
</body>
</html>
